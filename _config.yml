# ===== 站点基础信息 =====
title: TsukiShima987 的博客
author: TsukiShima987
description: >-
  一点个人想法和技术分享，偶尔也会写点随笔。

# 用户站点仓库（<用户名>.github.io）的 baseurl 必须为空字符串。
baseurl: ""
url: "https://tsukishima987.github.io"

github_username: TsukiShima987

# ===== 构建 =====
timezone: Asia/Shanghai

# 文章 URL 形式：/2026/09/20/welcome/
# 刻意不包含 :categories，因为分类常用中文，会让地址出现中文转义字符。
permalink: /:year/:month/:day/:title/

# 不复制到 _site/ 的文件。
# 注意：一旦显式设置 exclude，Jekyll 的默认排除列表会被整体替换，
# 所以下面把 Gemfile / vendor / 缓存 这些默认项也一并列出了。
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - gemfiles/
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .sass-cache/
  - .jekyll-cache/

# ===== 主题 =====
theme: minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag

minima:
  date_format: "%Y-%m-%d"

# 首页与列表页显示摘要而不是全文
show_excerpts: true

# 顶部导航栏显示的页面，按此顺序排列
header_pages:
  - about.md

# ===== 默认值 =====
# 这样新增文章时 front matter 里可以省掉 layout 一行
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page
